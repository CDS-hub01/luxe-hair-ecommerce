<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Orders | LUXE Hair</title>
    <link rel="stylesheet" href="css/my-orders.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>
  <body>
    <!-- ===================== HEADER / NAV ===================== -->
    <header class="site-header">
      <div class="nav-container">
        <a href="index.html" class="logo">LUXE</a>

        <nav id="nav-links" class="nav-links">
          <a href="index.html">Home</a>
          <a href="shop.html">Shop</a>
          <a href="about.html">About</a>

          <a
            href="login.html"
            id="account-link-mobile"
            class="mobile-account-link"
          >
            <i class="fa-solid fa-user"></i>
            <span id="account-label-mobile">Login</span>
          </a>
          <button
            id="logout-btn-mobile"
            type="button"
            class="mobile-account-link mobile-logout-btn"
            hidden
          >
            <i class="fa-solid fa-right-from-bracket"></i> Logout
          </button>
        </nav>

        <div class="nav-right">
          <button
            id="dark-mode-toggle"
            class="icon-btn"
            type="button"
            title="Toggle dark mode"
          >
            <i class="fa-regular fa-moon" id="dark-mode-icon"></i>
          </button>

          <a
            href="login.html"
            id="account-link"
            class="icon-btn account-link"
            title="Account"
          >
            <i class="fa-solid fa-user"></i>
            <span id="account-label">Login</span>
          </a>

          <button
            id="logout-btn"
            class="icon-btn"
            type="button"
            title="Log out"
            hidden
          >
            <i class="fa-solid fa-right-from-bracket"></i>
          </button>

          <a href="cart.html" class="icon-btn cart-link" title="View cart">
            <i class="fa-solid fa-cart-shopping"></i>
            <span id="cart-count" class="cart-badge">0</span>
          </a>

          <button id="hamburger-btn" class="hamburger-btn" type="button">
            <i class="fa-solid fa-bars" id="hamburger-icon"></i>
          </button>
        </div>
      </div>
    </header>

    <!-- ===================== PAGE TITLE ===================== -->
    <section class="orders-header">
      <h1>My Orders</h1>
      <p id="orders-greeting"></p>
    </section>

    <!-- ===================== ORDERS LIST ===================== -->
    <section class="orders-main">
      <p id="orders-empty" class="empty-state" hidden>
        <i class="fa-solid fa-bag-shopping"></i>
        You haven't placed any orders yet.
        <a href="shop.html" class="btn btn-primary">Start Shopping</a>
      </p>

      <div id="orders-list" class="orders-list">
        <!-- Order cards injected here by my-orders.js -->
      </div>
    </section>

    <!-- ===================== FOOTER ===================== -->
    <footer class="site-footer">
      <div class="footer-content">
        <div class="footer-brand">
          <span class="logo">LUXE</span>
          <p>Premium hair, delivered with confidence.</p>
        </div>

        <div class="footer-links">
          <h4>Quick Links</h4>
          <a href="index.html">Home</a>
          <a href="shop.html">Shop</a>
          <a href="about.html">About & Contact</a>
          <a href="cart.html">Cart</a>
        </div>

        <div class="footer-contact">
          <h4>Contact</h4>
          <p>Houston, Texas, USA</p>
          <p>hello@luxehair.example</p>
        </div>
      </div>
      <p class="footer-copyright">
        &copy; 2026 LUXE Hair. All rights reserved.
      </p>
    </footer>

    <script src="js/my-orders.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
