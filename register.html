<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account | LUXE Hair</title>
    <link rel="stylesheet" href="css/register.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>
  <body>
    <!-- ===================== HEADER / NAV ===================== -->
    <header class="site-header">
      <div class="nav-container">
        <a href="index.html" class="logo">LUXE</a>
      </div>
    </header>

    <!-- ===================== REGISTER FORM ===================== -->
    <section class="auth-page">
      <form class="auth-box" id="register-form">
        <h1>Create Your Account</h1>
        <p class="auth-subtitle">
          Join LUXE to check out faster and track your orders.
        </p>

        <label for="register-name">Full Name</label>
        <input type="text" id="register-name" required />
        <span class="field-error" id="error-register-name"></span>

        <label for="register-email">Email</label>
        <input type="email" id="register-email" required />
        <span class="field-error" id="error-register-email"></span>

        <label for="register-password">Password</label>
        <input type="password" id="register-password" required />
        <span class="field-error" id="error-register-password"></span>

        <label for="register-confirm-password">Confirm Password</label>
        <input type="password" id="register-confirm-password" required />
        <span class="field-error" id="error-register-confirm-password"></span>

        <p id="register-error" class="form-level-error" hidden></p>

        <button type="submit" class="btn btn-primary btn-large">
          Create Account
        </button>

        <p class="auth-switch">
          Already have an account? <a href="login.html">Log In</a>
        </p>
      </form>
    </section>

    <script src="js/register.js"></script>
  </body>
</html>
